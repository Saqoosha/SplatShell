name: Follow SuperSplat releases

# Daily: when SuperSplat has a release newer than the pinned commit, build it
# with our patches and open a pull request. See scripts/follow_supersplat.sh.

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: SuperSplat release tag to propose (default the latest)
        required: false
      force:
        description: Propose it even when it is not newer than the pin
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: follow-supersplat

jobs:
  follow:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Propose the latest SuperSplat release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: ./scripts/follow_supersplat.sh
